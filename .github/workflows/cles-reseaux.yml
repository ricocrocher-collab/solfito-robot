name: Clés réseaux pour l'admin (à la main, une fois)
# Envoie les clés YouTube et Meta (secrets de CE dépôt) au coffre-fort de Supabase, pour l'onglet Admin « Commentaires »
# (lire et répondre aux commentaires YouTube / Facebook / Instagram depuis solfito.com). Jeton OIDC de GitHub vérifié par
# la fonction Supabase « reseaux » : seul CE fichier, sur la branche main de CE dépôt, est accepté. Les clés ne passent par aucun fichier.
# À relancer après chaque changement de YT_REFRESH_TOKEN ou META_PAGE_TOKEN.
on: workflow_dispatch
permissions: {id-token: write, contents: read}
jobs:
  envoyer:
    runs-on: ubuntu-latest
    steps:
      - env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
        run: |
          oidc=$(curl -fsS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=solfito-reseaux" | python3 -c 'import sys,json;print(json.load(sys.stdin)["value"])')
          python3 -c 'import json,os;print(json.dumps({"cles":{k:os.environ.get(k,"") for k in ["YT_CLIENT_ID","YT_CLIENT_SECRET","YT_REFRESH_TOKEN","META_PAGE_TOKEN"]}}))' > /tmp/c.json
          curl -fsS -X POST -H "Authorization: Bearer $oidc" -H "Content-Type: application/json" --data @/tmp/c.json https://lskljjzijrtmakbinecr.supabase.co/functions/v1/reseaux
          rm -f /tmp/c.json
