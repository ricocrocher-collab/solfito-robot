name: Envoyer le jeton du robot à Supabase (à la main, une fois)
# Supabase (pg_cron, à l'heure exacte) lance « Planning vidéos » à 12 h 30 et 17 h 30 (Paris) avec ce jeton.
# À relancer seulement si le secret ROBOT_PAT change. Le jeton ne passe jamais par un fichier ni le chat.
on: workflow_dispatch
permissions: {id-token: write, contents: read}
jobs:
  envoyer:
    runs-on: ubuntu-latest
    steps:
      - env: {JETON: "${{ secrets.ROBOT_PAT }}"}
        run: |
          oidc=$(curl -fsS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=solfito-jeton" | python3 -c 'import sys,json;print(json.load(sys.stdin)["value"])')
          python3 -c 'import json,os;print(json.dumps({"jeton":os.environ["JETON"]}))' > /tmp/j.json
          curl -fsS -X POST -H "Authorization: Bearer $oidc" -H "Content-Type: application/json" --data @/tmp/j.json https://lskljjzijrtmakbinecr.supabase.co/functions/v1/jeton-robot
          rm -f /tmp/j.json
