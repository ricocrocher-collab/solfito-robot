name: Planning vidéos (YouTube + Facebook + Instagram)
on:
  schedule:
    # 18 nov. : lancé à 12 h 30, 15 h 30, 17 h 30 et 20 h 30 PILE par Supabase (pg_cron « robot-poster », voir jeton-supabase.yml).
    # Ces horaires GitHub (souvent en retard) ne sont plus que des secours : planning.py ne poste jamais plus de 4 vidéos par jour.
    - cron: "47 11 * * *"   # secours de midi
    - cron: "47 14 * * *"   # secours de 15 h 30
    - cron: "47 16 * * *"   # secours de 17 h 30
    - cron: "47 19 * * *"   # secours de 20 h 30
  workflow_dispatch:
    inputs:
      forcer: {description: "Numéro de la vidéo à publier tout de suite (ex. 05) ; vide = celle du jour", required: false, default: ""}
permissions:
  contents: write
concurrency: {group: robot-ecrit, cancel-in-progress: false}
jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q requests
      - run: python outils/reseaux/planning.py
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          FORCER: ${{ inputs.forcer }}
      - if: always()
        run: |
          git config user.name "solfito-planning" && git config user.email "actions@users.noreply.github.com"
          git add outils/reseaux/planning.json
          git diff --cached --quiet && exit 0
          git commit -m "Planning vidéos : publication du $(date +%F)"
          for i in 1 2 3 4; do git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0; sleep $((i*5)); done; exit 1
