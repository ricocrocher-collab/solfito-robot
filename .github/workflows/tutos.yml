name: Usine à tutos piano (automatique)
on:
  # 18 nov. : lancé à l'heure exacte par Supabase (pg_cron « robot-tutos », fonction robot_lancer) ; plus d'horaire GitHub.
  workflow_dispatch:
    inputs:
      forcer:
        description: "Fabriquer 7 tutos même s'il en reste beaucoup (essai)"
        type: boolean
        default: false
permissions:
  contents: write
concurrency: {group: robot-ecrit, cancel-in-progress: false}
jobs:
  tutos:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: {repository: ricocrocher-collab/solfito, token: "${{ secrets.SOLFITO_PAT }}", path: src, sparse-checkout: "outils/usine-videos\noutils/video-hyperframes\nsite/audio/piano"}
      - run: |
          sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg fonts-noto-color-emoji >/dev/null
          pip install -q mido numpy scipy pillow
          npm install -g playwright >/dev/null && npx playwright install --with-deps chromium >/dev/null
      - name: Fabriquer les tutos
        env:
          TUTOS_FORCER: ${{ inputs.forcer && '1' || '0' }}
        run: python outils/usine/tutos.py
      - if: always()
        run: |
          git config user.name "solfito-robot" && git config user.email "actions@users.noreply.github.com"
          git add videos outils/reseaux/planning.json outils/usine; git diff --cached --quiet && exit 0
          git commit -qm "Usine à tutos : $(date +%F)"
          for i in 1 2 3 4; do git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0; sleep $((i*5)); done; exit 1
