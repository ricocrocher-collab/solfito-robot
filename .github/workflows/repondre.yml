name: Réponses automatiques (commentaires + avis Google Play)
on:
  # 18 nov. : lancé à l'heure exacte par Supabase (pg_cron « robot-repondre », fonction robot_lancer) ; plus d'horaire GitHub.
  workflow_dispatch:
    inputs:
      essai: {description: "Essai : affiche les réponses sans les envoyer", type: boolean, default: false}
permissions:
  contents: write
concurrency: {group: robot-ecrit, cancel-in-progress: false}
jobs:
  repondre:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q requests google-auth
      - uses: actions/cache@v4
        with: {path: ~/.ollama/models, key: ollama-qwen2.5-7b}
      - name: IA gratuite de secours (Ollama + Qwen 2.5 7B, seulement sans GEMINI_API_KEY)
        run: |
          curl -fsSL https://ollama.com/install.sh | sh >/dev/null 2>&1
          (ollama serve >/dev/null 2>&1 &) ; sleep 5
          ollama pull qwen2.5:7b >/dev/null 2>&1 && echo "IA prête"
      - run: python outils/reseaux/repondre.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          GOOGLE_PLAY_JSON: ${{ secrets.GOOGLE_PLAY_JSON }}
          ESSAI: ${{ inputs.essai && '1' || '' }}
      - if: always()
        run: |
          git config user.name "solfito-robot" && git config user.email "actions@users.noreply.github.com"
          git add outils/reseaux/repondus.json 2>/dev/null; git diff --cached --quiet && exit 0
          git commit -qm "Réponses automatiques du $(date +%F)"
          for i in 1 2 3 4; do git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0; sleep $((i*5)); done; exit 1
