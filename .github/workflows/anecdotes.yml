name: Anecdotes Mélo (Kaggle voix + rendu, automatique)
on:
  # 18 nov. : lancé à l'heure exacte par Supabase (pg_cron « robot-anecdotes », fonction robot_lancer) ; plus d'horaire GitHub.
  workflow_dispatch:
permissions:
  contents: write
concurrency: {group: robot-ecrit, cancel-in-progress: false}
jobs:
  anecdotes:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: {repository: ricocrocher-collab/solfito, token: "${{ secrets.SOLFITO_PAT }}", path: src, sparse-checkout: "outils/usine-videos\noutils/video-hyperframes/assets\noutils/voix/voicebox"}
      - run: |
          sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg fonts-noto-color-emoji >/dev/null
          pip install -q pillow numpy
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm install --silent playwright && npx playwright install --with-deps chromium >/dev/null
      - name: Récupérer puis lancer
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          NODE_PATH: /tmp/pw/node_modules
        run: |
          python outils/usine/anecdotes.py recuperer
          python outils/usine/anecdotes.py lancer
      - if: always()
        run: |
          git config user.name "solfito-robot" && git config user.email "actions@users.noreply.github.com"
          git add videos outils/reseaux/planning.json outils/usine/etat-anecdotes.json outils/usine/deja-anecdotes.json; git diff --cached --quiet && exit 0
          git commit -qm "Anecdotes Mélo : $(date +%F)"
          for i in 1 2 3 4; do git pull --rebase -q origin main && git -c push.negotiate=true push -q origin HEAD:main && exit 0; sleep $((i*5)); done; exit 1
