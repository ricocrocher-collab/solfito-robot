name: Stats quotidiennes (onglet Admin « Tout » + bilan du lundi)
on:
  # 18 nov. : lancé à l'heure exacte par Supabase (pg_cron « robot-stats », fonction robot_lancer) ; plus d'horaire GitHub.
  workflow_dispatch:
permissions:
  contents: read
  id-token: write   # jeton OIDC de GitHub : la fonction Supabase stats-robot vérifie qu'il vient bien de ce dépôt (aucun secret partagé)
jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q requests google-auth pyjwt cryptography
      - run: python outils/stats/collecter.py
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          GOOGLE_PLAY_JSON: ${{ secrets.GOOGLE_PLAY_JSON }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_VENDOR: ${{ secrets.ASC_VENDOR || '95052417' }}
          PLAY_BUCKET: ${{ secrets.PLAY_BUCKET }}
